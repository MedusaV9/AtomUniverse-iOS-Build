# Builds an unsigned AtomUniverse .ipa from an archived Unity iOS Xcode export.
# Without export_url it builds the tiny XcodeGen app in pipeline-test/ to prove the pipeline.
# This repo is public: no game code, no secrets, no credentials. Documentation: README.md.
name: ios-ipa

on:
  workflow_dispatch:
    inputs:
      export_url:
        description: Direct https link to the archive of the Unity iOS Xcode export (.tar.zst, .zip, .tar.gz, .tar.xz). Empty = pipeline test with the mini app.
        type: string
        required: false
        default: ''
      export_sha256:
        description: SHA-256 of that archive (optional, recommended)
        type: string
        required: false
        default: ''
      version:
        description: Version in the file name, e.g. 0.2.0
        type: string
        required: true
        default: 0.0.0
      release_tag:
        description: Tag of an existing draft release in this repo to attach the .ipa to (optional)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ios-ipa
  cancel-in-progress: false

env:
  XCODE_APP: /Applications/Xcode_26.3.app
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  IPA_PREFIX: AtomUniverse

jobs:
  ipa:
    name: Unsigned .ipa
    runs-on: macos-26
    timeout-minutes: ${{ inputs.export_url == '' && 20 || 90 }}
    outputs:
      ipa_name: ${{ steps.build.outputs.ipa_name }}
    steps:
      - name: Check inputs
        id: inputs
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # The export link must not show up in this public log. It is read from the event file, not
          # from env (the log prints a step's env before a mask exists), and masked for all later steps.
          EXPORT_URL=$(jq -r '.inputs.export_url // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$EXPORT_URL" ]; then echo "::add-mask::$EXPORT_URL"; fi
          printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9._-]{1,40}$' || { echo "::error::version may only use A-Z a-z 0-9 . _ -"; exit 1; }
          if [ -n "$RELEASE_TAG" ]; then
            printf '%s' "$RELEASE_TAG" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || { echo "::error::release_tag may only use A-Z a-z 0-9 . _ / -"; exit 1; }
          fi
          if [ -z "$EXPORT_URL" ]; then
            echo "mode=pipeline-test" >>"$GITHUB_OUTPUT"
            echo "version=$VERSION-pipelinetest" >>"$GITHUB_OUTPUT"
          else
            echo "mode=unity-export" >>"$GITHUB_OUTPUT"
            echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          fi

      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          sw_vers

      - name: Generate pipeline-test project (XcodeGen)
        id: pipeline
        if: steps.inputs.outputs.mode == 'pipeline-test'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec pipeline-test/project.yml
          {
            echo "kind=--project"
            echo "path=pipeline-test/AtomUniversePipelineTest.xcodeproj"
            echo "scheme=AtomUniversePipelineTest"
          } >>"$GITHUB_OUTPUT"

      - name: Fetch Unity export
        id: export
        if: steps.inputs.outputs.mode == 'unity-export'
        env:
          EXPORT_URL: ${{ inputs.export_url }}
          EXPORT_SHA256: ${{ inputs.export_sha256 }}
        run: scripts/fetch-export.sh --url "$EXPORT_URL" --sha256 "$EXPORT_SHA256" --dest "$RUNNER_TEMP/export"

      - name: Archive and package
        id: build
        env:
          KIND: ${{ steps.pipeline.outputs.kind || steps.export.outputs.kind }}
          PROJECT: ${{ steps.pipeline.outputs.path || steps.export.outputs.path }}
          SCHEME: ${{ steps.pipeline.outputs.scheme || 'Unity-iPhone' }}
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          scripts/build-unsigned-ipa.sh "$KIND" "$PROJECT" --scheme "$SCHEME" \
            --name "$IPA_PREFIX" --version "$VERSION" --out "$RUNNER_TEMP/ipa"

      - name: Upload .ipa
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.ipa_path }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log-${{ github.run_id }}
          path: ${{ runner.temp }}/ipa/xcodebuild-archive.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: success()
        env:
          MODE: ${{ steps.inputs.outputs.mode }}
          IPA_NAME: ${{ steps.build.outputs.ipa_name }}
          IPA_BYTES: ${{ steps.build.outputs.ipa_bytes }}
          IPA_SHA256: ${{ steps.build.outputs.ipa_sha256 }}
          APP_NAME: ${{ steps.build.outputs.app_name }}
          ARCHIVE_SECONDS: ${{ steps.build.outputs.archive_seconds }}
          EXPORT_SHA256: ${{ steps.export.outputs.export_sha256 }}
          EXPORT_BYTES: ${{ steps.export.outputs.export_bytes }}
        run: |
          {
            echo "### Unsigned .ipa"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Mode | $MODE |"
            echo "| Artifact | \`$IPA_NAME\` |"
            echo "| App | \`$APP_NAME\` |"
            echo "| Size | $IPA_BYTES bytes |"
            echo "| SHA-256 | \`$IPA_SHA256\` |"
            echo "| xcodebuild archive | ${ARCHIVE_SECONDS}s |"
            if [ -n "$EXPORT_SHA256" ]; then
              echo "| Export archive | $EXPORT_BYTES bytes, SHA-256 \`$EXPORT_SHA256\` |"
              # IL2CPP prints its clang command lines into the xcodebuild log (--print-command-line).
              echo "| Log lines with -ffp-contract=off | $(grep -c -e '-ffp-contract=off' "$RUNNER_TEMP/ipa/xcodebuild-archive.log" || true) |"
            fi
            echo "| Xcode | $(xcodebuild -version | head -n 1) |"
          } >>"$GITHUB_STEP_SUMMARY"

  release:
    name: Attach to draft release
    needs: ipa
    if: inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Write access only here, not in the job that runs the export's build scripts.
    permissions:
      contents: write
    steps:
      - name: Download .ipa
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.ipa.outputs.ipa_name }}
          path: ipa

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          IPA_NAME: ${{ needs.ipa.outputs.ipa_name }}
        run: |
          draft=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) \
            || { echo "::error::no release with tag $TAG in $GITHUB_REPOSITORY"; exit 1; }
          [ "$draft" = true ] || { echo "::error::release $TAG is published, only draft releases are changed"; exit 1; }
          gh release upload "$TAG" "ipa/$IPA_NAME" -R "$GITHUB_REPOSITORY" --clobber
          echo "Attached $IPA_NAME to draft release $TAG"
          echo "Attached \`$IPA_NAME\` to draft release \`$TAG\`." >>"$GITHUB_STEP_SUMMARY"
