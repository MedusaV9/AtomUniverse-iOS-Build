# XcodeGen spec of a tiny SwiftUI app. It proves the archive and packaging steps of
# ios-ipa.yml before a Unity export exists. Not part of the game.
name: AtomUniversePipelineTest
options:
  bundleIdPrefix: com.atomuniverse
  deploymentTarget:
    iOS: "15.0"
targets:
  AtomUniversePipelineTest:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atomuniverse.pipelinetest
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AU Pipeline-Test
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
schemes:
  AtomUniversePipelineTest:
    build:
      targets:
        AtomUniversePipelineTest: all
    archive:
      config: Release
